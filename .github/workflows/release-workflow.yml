name: Release Workflow

on:
  push:
    tags:
      - "v*"
    branches:
      - stratospire
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build tarball
        run: build/sbt createTarball

      - name: Upload Release Asset
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unitycatalog
          path: target/unitycatalog-*.tar.gz
          if-no-files-found: error

      # On a `v*` tag push, publish a GitHub Release and attach the tarball.
      # Idempotent: an existing release for the tag is deleted first so re-runs
      # don't 422. Uses the workflow's own GITHUB_TOKEN (contents: write).
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TARBALL=$(ls target/unitycatalog-*.tar.gz | head -1)

          gh release delete "$TAG" --yes --cleanup-tag=false || true
          gh release create "$TAG" "$TARBALL" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
