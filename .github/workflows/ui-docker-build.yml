name: Build and Push Docker Images - unitycatalog-ui

on:
  push:
    branches:
      - main
      - stratospire
    paths:
      - ui/**
      - .github/workflows/ui-docker-build.yml
  pull_request:
    branches:
      - main
      - stratospire
    paths:
      - ui/**
      - .github/workflows/ui-docker-build.yml
  workflow_dispatch: {}

env:
  IMAGE: ghcr.io/stratospire/unitycatalog-ui

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

        # Required for multi-arch builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

        # Will generate tags for the image.
        # For refs/heads/stratospire: "stratospire", "stratospire-<short-sha>"
        # For refs/heads/main: "main", "main-<short-sha>"
      - name: Generate Metadata and Tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=sha,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stratospire' }},prefix={{branch}}-

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./ui
          # Push only for branch pushes (not PRs). The image is tagged from
          # `steps.meta.outputs.tags`; e.g. a push to stratospire at short SHA
          # 70ab5691 produces:
          #   ghcr.io/stratospire/unitycatalog-ui:stratospire
          #   ghcr.io/stratospire/unitycatalog-ui:stratospire-70ab5691
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

          # Use github actions cache: https://docs.docker.com/build/cache/backends/gha/
          cache-from: type=gha
          cache-to: type=gha,mode=max
